<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Winter Royale visual fixture</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:18px Arial,sans-serif;background:#16191b;color:#eee}.head{height:72px;display:flex;align-items:center;padding:0 28px;gap:28px;position:relative;z-index:5;background:#1d2022}.head__logo-icon{width:35px}.head__logo-icon svg{width:100%}.head__title{font-size:28px;color:#ddd}.head__actions{margin-left:auto;display:flex;gap:28px}.head__action{width:34px;height:34px;border:2px solid #aaa;border-radius:50%}.content{padding:26px 32px;position:relative;z-index:3}.content h2{font-weight:400;margin:0 0 22px;font-size:25px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}.card__view{height:300px;background:linear-gradient(155deg,#26363c,#79493d);position:relative}.card:nth-child(2n) .card__view{background:linear-gradient(155deg,#243b52,#735f4e)}.card:nth-child(3n) .card__view{background:linear-gradient(155deg,#4a2328,#ba6a22)}.card__title{margin-top:10px;font-size:19px}.card__vote{position:absolute;right:9px;bottom:9px;padding:4px 7px;border-radius:5px;background:#222}.card.focus .card__view{transform:scale(1.035)}.card.focus .card__title{font-weight:bold}.button{display:inline-block;margin-top:25px;padding:12px 22px;border:2px solid #aaa}.button.focus{border-color:white}
  </style>
</head>
<body>
  <div class="head"><div class="head__logo-icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/></svg></div><div class="head__title">Сейчас смотрят</div><div class="head__actions"><span class="head__action"></span><span class="head__action"></span><span class="head__action"></span><span class="head__action"></span></div></div>
  <main class="content"><h2>Новогодняя коллекция</h2><div class="cards">
    <div class="card focus"><div class="card__view"><span class="card__vote">8.7</span></div><div class="card__title">Зимняя премьера</div></div>
    <div class="card"><div class="card__view"><span class="card__vote">7.9</span></div><div class="card__title">Рождественская история</div></div>
    <div class="card"><div class="card__view"><span class="card__vote">8.1</span></div><div class="card__title">Новый год</div></div>
    <div class="card"><div class="card__view"><span class="card__vote">7.6</span></div><div class="card__title">Снежный вечер</div></div>
    <div class="card"><div class="card__view"><span class="card__vote">8.3</span></div><div class="card__title">Королевское Рождество</div></div>
    <div class="card"><div class="card__view"><span class="card__vote">7.8</span></div><div class="card__title">Подарок</div></div>
  </div><div class="button focus">Смотреть</div></main>
  <script>
    window.appready=true;window.Lampa={Storage:{get:function(k,d){return d}},SettingsApi:{addComponent:function(){},addParam:function(){}},Listener:{follow:function(){}}};
  </script>
  <script src="../winter-royale.js"></script>
</body>
</html>
